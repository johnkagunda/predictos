<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Betika — Live Soccer</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#3fb950" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Betika Live" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

    header {
      background: #161b22; border-bottom: 1px solid #21262d;
      padding: 14px 24px; display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 20px; font-weight: 800; color: #3fb950; letter-spacing: -.5px; }
    .badge { background: #3fb95018; color: #3fb950; border: 1px solid #3fb95040; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1;box-shadow:0 0 0 0 #3fb95060}50%{opacity:.5;box-shadow:0 0 0 5px transparent} }
    .spacer { flex: 1; }
    .refresh-label { font-size: 12px; color: #484f58; }
    #countdown { font-size: 12px; color: #3fb950; font-weight: 600; background: #3fb95018; border: 1px solid #3fb95030; border-radius: 4px; padding: 2px 7px; }

    .stats { display: flex; gap: 10px; padding: 18px 24px 0; flex-wrap: wrap; }
    .stat { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 10px 18px; min-width: 100px; }
    .stat .val { font-size: 26px; font-weight: 700; }
    .stat .lbl { font-size: 11px; color: #8b949e; margin-top: 1px; }

    .toolbar { padding: 14px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .search-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-wrap input {
      width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; padding: 7px 10px 7px 32px; font-size: 13px; outline: none;
    }
    .search-wrap input:focus { border-color: #3fb950; }
    .search-wrap::before { content: '🔍'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 12px; pointer-events: none; }
    select { background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #e6edf3; padding: 7px 10px; font-size: 13px; cursor: pointer; outline: none; }
    select:focus { border-color: #3fb950; }
    .filter-tab { background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #8b949e; padding: 7px 14px; font-size: 13px; cursor: pointer; }
    .filter-tab.active { border-color: #3fb950; color: #3fb950; background: #3fb95018; }

    .grid { padding: 0 24px 32px; display: grid; gap: 8px; }

    .card { background: #161b22; border: 1px solid #21262d; border-radius: 10px; padding: 14px 18px; transition: border-color .15s; }
    .card:hover { border-color: #3fb95050; }

    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .league-name { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: .6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    .min-badge { border-radius: 5px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
    .min-badge.live1 { background: #58a6ff18; color: #58a6ff; border: 1px solid #58a6ff40; }
    .min-badge.live2 { background: #3fb95018; color: #3fb950; border: 1px solid #3fb95040; }
    .min-badge.ht    { background: #f0883e18; color: #f0883e; border: 1px solid #f0883e40; }
    .min-badge.ft    { background: #8b949e18; color: #8b949e; border: 1px solid #8b949e40; }
    .min-badge.pre   { background: #bc8cff18; color: #bc8cff; border: 1px solid #bc8cff40; }

    .teams-row { display: flex; align-items: center; gap: 8px; }
    .team { flex: 1; font-size: 14px; font-weight: 600; }
    .team.away { text-align: right; }
    .score-block {
      flex-shrink: 0; background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 5px 14px; font-size: 18px; font-weight: 800; letter-spacing: 3px;
      min-width: 72px; text-align: center;
    }
    .score-block.live2 { border-color: #3fb950; color: #3fb950; }
    .score-block.live1 { border-color: #58a6ff; color: #58a6ff; }
    .score-block.ht    { border-color: #f0883e; color: #f0883e; }

    .meta-row { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: #484f58; }
    .meta-row span { display: flex; align-items: center; gap: 3px; }

    .odds-row { display: flex; gap: 6px; margin-top: 8px; }
    .odd-btn { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; padding: 4px 6px; text-align: center; }
    .odd-btn .odd-label { display: block; font-size: 10px; color: #484f58; }
    .odd-btn .odd-val   { display: block; font-size: 13px; font-weight: 700; color: #e6edf3; }

    .state { text-align: center; padding: 64px 20px; color: #8b949e; }
    .state .icon { font-size: 48px; display: block; margin-bottom: 12px; }
    .spinner { width: 34px; height: 34px; border: 3px solid #21262d; border-top-color: #3fb950; border-radius: 50%; animation: spin .75s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .retry-btn { margin-top: 14px; background: #3fb950; color: #0d1117; border: none; border-radius: 6px; padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .error-detail { font-size: 11px; color: #484f58; margin-top: 6px; font-family: monospace; }
    .foot { text-align: center; font-size: 11px; color: #484f58; padding: 12px 0 24px; }
    .probets-btn {
      background: #f0883e18; border: 1px solid #f0883e50; border-radius: 6px;
      color: #f0883e; padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-decoration: none; white-space: nowrap;
    }
    .probets-btn:hover { background: #f0883e30; }
    #notif-btn {
      background: #21262d; border: 1px solid #30363d; border-radius: 6px;
      color: #8b949e; padding: 6px 12px; font-size: 12px; cursor: pointer;
      white-space: nowrap; transition: all .15s;
    }
    #notif-btn:hover { border-color: #3fb950; color: #3fb950; }
    #notif-btn.on { background: #3fb95018; border-color: #3fb95050; color: #3fb950; }
    #track-btn {
      background: #bc8cff18; border: 1px solid #bc8cff50; border-radius: 6px;
      color: #bc8cff; padding: 6px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    #track-btn:hover { background: #bc8cff30; border-color: #bc8cff; }
    #track-btn:disabled { opacity: .45; cursor: not-allowed; }
    #install-btn {
      display: none; /* shown by JS when browser fires beforeinstallprompt */
      align-items: center; gap: 6px;
      background: #f0883e; border: none; border-radius: 6px;
      color: #0d1117; padding: 6px 14px; font-size: 12px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    #install-btn:hover { background: #e07730; }
  </style>
</head>
<body>

<header>
  <div class="logo">⚽ Betika Live</div>
  <div class="badge">LIVE</div>
  <div class="dot"></div>
  <div class="spacer"></div>
  <a class="probets-btn" href="/probets.html">🎯 Pro Bets</a>
  <button id="install-btn" title="Install app">⬇️ Install App</button>
  <button id="track-btn" onclick="trackNow()">🔍 Track Pro Bets</button>
  <button id="notif-btn">🔕 Enable Alerts</button>
  <span class="refresh-label">Next refresh in</span>
  <div id="countdown">30s</div>
</header>

<div class="stats">
  <div class="stat"><div class="val" id="stotal">—</div><div class="lbl">Live Soccer</div></div>
  <div class="stat"><div class="val" id="s2h">—</div><div class="lbl">2nd Half</div></div>
  <div class="stat"><div class="val" id="s1h">—</div><div class="lbl">1st Half</div></div>
  <div class="stat"><div class="val" id="sleagues">—</div><div class="lbl">Leagues</div></div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search team or league…" />
  </div>
  <button class="filter-tab active" data-filter="all">All</button>
  <button class="filter-tab" data-filter="2nd half">2nd Half</button>
  <button class="filter-tab" data-filter="1st half">1st Half</button>
  <button class="filter-tab" data-filter="half time">Half Time</button>
  <select id="sort">
    <option value="time">Sort: Kick-off</option>
    <option value="league">Sort: League</option>
    <option value="minute">Sort: Minute</option>
  </select>
</div>

<div class="grid" id="grid">
  <div class="state"><div class="spinner"></div>Loading live games…</div>
</div>
<div class="foot" id="foot"></div>

<script>
  const REFRESH_SEC = 30;
  let allMatches = [];
  let activeFilter = 'all';
  let countdown = REFRESH_SEC;
  let timer;

  // ── Period helpers ────────────────────────────────────────────────────────
  function normStatus(m) {
    return (m.event_status || '').toLowerCase().trim();
  }

  function badgeClass(m) {
    const s = normStatus(m);
    if (s === '2nd half') return 'live2';
    if (s === '1st half') return 'live1';
    if (s === 'half time') return 'ht';
    if (s === 'ended' || s === 'finished' || s === 'ft') return 'ft';
    return 'pre';
  }

  function minuteLabel(m) {
    if (m.match_time) {
      // "59:04" → "59'"
      const mins = m.match_time.split(':')[0];
      const s = normStatus(m);
      if (s === 'half time') return 'HT';
      if (s === 'ended' || s === 'finished') return 'FT';
      return `${parseInt(mins)}'`;
    }
    return normStatus(m).toUpperCase() || '?';
  }

  function parseMinute(m) {
    if (m.match_time) return parseInt(m.match_time.split(':')[0]) || 0;
    return 0;
  }

  function parseScore(m) {
    if (m.current_score && m.current_score !== '-:-') return m.current_score.replace(':', ' - ');
    return 'vs';
  }

  // ── Card ──────────────────────────────────────────────────────────────────
  function renderCard(m) {
    const bc = badgeClass(m);
    const label = minuteLabel(m);
    const score = parseScore(m);
    const isLive = bc === 'live1' || bc === 'live2';

    const cardBorder = bc === 'live2' ? 'border-color:#3fb95030' : bc === 'live1' ? 'border-color:#58a6ff30' : '';

    const h1  = m.home_odd    ? `<div class="odd-btn"><span class="odd-label">1</span><span class="odd-val">${m.home_odd}</span></div>` : '';
    const hx  = m.neutral_odd ? `<div class="odd-btn"><span class="odd-label">X</span><span class="odd-val">${m.neutral_odd}</span></div>` : '';
    const h2  = m.away_odd    ? `<div class="odd-btn"><span class="odd-label">2</span><span class="odd-val">${m.away_odd}</span></div>` : '';

    const yc  = (m.home_yellow_card || 0) + (m.away_yellow_card || 0);
    const rc  = (m.home_red_card || 0) + (m.away_red_card || 0);
    const crn = (m.home_corners || 0) + (m.away_corners || 0);
    const ht  = m.ht_score && m.ht_score !== '-:-' ? `<span>🕐 HT ${m.ht_score.replace(':', '-')}</span>` : '';
    const meta = [
      yc  ? `<span>🟨 ${m.home_yellow_card}-${m.away_yellow_card}</span>` : '',
      rc  ? `<span>🟥 ${m.home_red_card}-${m.away_red_card}</span>` : '',
      crn ? `<span>⛳ ${m.home_corners}-${m.away_corners}</span>` : '',
      ht,
    ].filter(Boolean).join('');

    return `
    <div class="card" style="${cardBorder}">
      <div class="card-top">
        <span class="league-name">${m.competition_name || ''} · ${m.category || ''}</span>
        <span class="min-badge ${bc}">${label}</span>
      </div>
      <div class="teams-row">
        <div class="team home">${m.home_team}</div>
        <div class="score-block ${isLive ? bc : ''}">${score}</div>
        <div class="team away">${m.away_team}</div>
      </div>
      ${meta ? `<div class="meta-row">${meta}</div>` : ''}
      ${h1||hx||h2 ? `<div class="odds-row">${h1}${hx}${h2}</div>` : ''}
    </div>`;
  }

  // ── Filter + sort ─────────────────────────────────────────────────────────
  function applyFilters() {
    const q = document.getElementById('search').value.toLowerCase();
    const sortVal = document.getElementById('sort').value;

    let list = activeFilter === 'all'
      ? allMatches
      : allMatches.filter(m => normStatus(m) === activeFilter);

    if (q) {
      list = list.filter(m =>
        (m.home_team || '').toLowerCase().includes(q) ||
        (m.away_team || '').toLowerCase().includes(q) ||
        (m.competition_name || '').toLowerCase().includes(q)
      );
    }

    if (sortVal === 'league') list = [...list].sort((a,b) => (a.competition_name||'').localeCompare(b.competition_name||''));
    else if (sortVal === 'minute') list = [...list].sort((a,b) => parseMinute(b) - parseMinute(a));
    else list = [...list].sort((a,b) => new Date(a.start_time) - new Date(b.start_time));

    return list;
  }

  function render() {
    const list = applyFilters();
    const n2h = allMatches.filter(m => normStatus(m) === '2nd half').length;
    const n1h = allMatches.filter(m => normStatus(m) === '1st half').length;
    const leagues = new Set(allMatches.map(m => m.competition_name).filter(Boolean));

    document.getElementById('stotal').textContent = allMatches.length;
    document.getElementById('s2h').textContent = n2h;
    document.getElementById('s1h').textContent = n1h;
    document.getElementById('sleagues').textContent = leagues.size;

    const grid = document.getElementById('grid');
    grid.innerHTML = list.length
      ? list.map(renderCard).join('')
      : `<div class="state"><span class="icon">🕐</span>No matches for this filter right now.</div>`;
  }

  // ── Fetch ─────────────────────────────────────────────────────────────────
  async function fetchGames(silent = false) {
    if (!silent) document.getElementById('grid').innerHTML = '<div class="state"><div class="spinner"></div>Loading…</div>';
    try {
      const res = await fetch('/api/live-soccer');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'API error');
      allMatches = json.matches || [];
      document.getElementById('foot').textContent =
        `Last updated: ${new Date(json.fetched_at).toLocaleTimeString()}  ·  ${allMatches.length} live soccer matches`;
      render();
    } catch (err) {
      if (!silent) document.getElementById('grid').innerHTML = `
        <div class="state">
          <span class="icon">⚠️</span>Failed to load
          <div class="error-detail">${err.message}</div>
          <button class="retry-btn" onclick="fetchGames()">Retry</button>
        </div>`;
    }
  }

  // ── Countdown ─────────────────────────────────────────────────────────────
  function startCountdown() {
    clearInterval(timer);
    countdown = REFRESH_SEC;
    document.getElementById('countdown').textContent = countdown + 's';
    timer = setInterval(() => {
      countdown--;
      document.getElementById('countdown').textContent = countdown + 's';
      if (countdown <= 0) { fetchGames(true); countdown = REFRESH_SEC; }
    }, 1000);
  }

  // ── Events ────────────────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', render);
  document.getElementById('sort').addEventListener('change', render);
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  fetchGames();
  startCountdown();

  async function trackNow() {
    const btn = document.getElementById('track-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Scanning…';
    try {
      const res  = await fetch('/api/track-now', { method: 'POST' });
      const json = await res.json();
      if (json.count > 0) {
        btn.textContent = `✓ Locked ${json.count} match${json.count > 1 ? 'es' : ''}`;
        btn.style.color = '#3fb950';
        btn.style.borderColor = '#3fb95050';
      } else {
        btn.textContent = '— No new kicks';
      }
    } catch (e) {
      btn.textContent = '⚠ Error';
    } finally {
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '🔍 Track Pro Bets';
        btn.style.color = '';
        btn.style.borderColor = '';
      }, 4000);
    }
  }
</script>
<script src="/pwa.js"></script>
</body>
</html>
