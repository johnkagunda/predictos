<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Bets — Betika Live</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f0883e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pro Bets" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

    header {
      background: #161b22; border-bottom: 1px solid #21262d;
      padding: 14px 24px; display: flex; align-items: center; gap: 14px;
      position: sticky; top: 0; z-index: 10;
    }
    .back-btn {
      background: none; border: 1px solid #30363d; border-radius: 6px;
      color: #8b949e; padding: 5px 12px; font-size: 12px; cursor: pointer;
      text-decoration: none; display: flex; align-items: center; gap: 5px;
    }
    .back-btn:hover { border-color: #58a6ff; color: #58a6ff; }
    .logo { font-size: 20px; font-weight: 800; color: #f0883e; }
    .spacer { flex: 1; }
    .refresh-label { font-size: 12px; color: #484f58; }
    #countdown { font-size: 12px; color: #f0883e; font-weight: 600; background: #f0883e18; border: 1px solid #f0883e30; border-radius: 4px; padding: 2px 7px; }
    #notif-btn {
      background: #21262d; border: 1px solid #30363d; border-radius: 6px;
      color: #8b949e; padding: 6px 12px; font-size: 12px; cursor: pointer;
      white-space: nowrap; transition: all .15s;
    }
    #notif-btn:hover { border-color: #f0883e; color: #f0883e; }
    #notif-btn.on { background: #f0883e18; border-color: #f0883e50; color: #f0883e; }
    #install-btn {
      display: none; align-items: center; gap: 6px;
      background: #f0883e; border: none; border-radius: 6px;
      color: #0d1117; padding: 6px 14px; font-size: 12px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }

    .stats { display: flex; gap: 10px; padding: 16px 24px 0; flex-wrap: wrap; }
    .stat { background: #161b22; border: 1px solid #21262d; border-radius: 8px; padding: 10px 18px; min-width: 90px; }
    .stat .val { font-size: 24px; font-weight: 700; }
    .stat .val.green  { color: #3fb950; }
    .stat .val.orange { color: #f0883e; }
    .stat .val.gray   { color: #8b949e; }
    .stat .lbl { font-size: 11px; color: #8b949e; margin-top: 2px; }

    .toolbar { padding: 12px 24px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .search-wrap { position: relative; flex: 1; min-width: 180px; }
    .search-wrap input {
      width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; padding: 7px 10px 7px 32px; font-size: 13px; outline: none;
    }
    .search-wrap input:focus { border-color: #f0883e; }
    .search-wrap::before { content: '🔍'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 12px; pointer-events: none; }

    .grid { padding: 0 24px 32px; display: grid; gap: 10px; }

    .section-label {
      padding: 14px 2px 6px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .8px; color: #484f58;
      display: flex; align-items: center; gap: 8px;
      border-top: 1px solid #21262d; margin-top: 6px;
    }
    .section-label:first-child { border-top: none; margin-top: 0; }

    .sdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
    .sdot.green  { background: #3fb950; box-shadow: 0 0 6px #3fb950aa; animation: pg 1.8s infinite; }
    .sdot.orange { background: #f0883e; box-shadow: 0 0 6px #f0883eaa; animation: po 1.8s infinite; }
    .sdot.gray   { background: #484f58; }
    @keyframes pg { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes po { 0%,100%{opacity:1} 50%{opacity:.4} }

    .card { border-radius: 10px; padding: 14px 16px; position: relative; transition: border-color .15s; background: #161b22; }
    .card.probet   { border: 1px solid #3fb95060; }
    .card.probet:hover { border-color: #3fb950; }
    .card.watching { border: 1px solid #f0883e40; }
    .card.watching:hover { border-color: #f0883e90; }
    .card.tracking { border: 1px solid #30363d; }
    .card.tracking:hover { border-color: #f0883e40; }

    .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding-right: 90px; }
    .league-name { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: .6px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .min-badge { border-radius: 5px; padding: 2px 8px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .min-badge.green  { background: #3fb95018; color: #3fb950; border: 1px solid #3fb95040; }
    .min-badge.orange { background: #f0883e18; color: #f0883e; border: 1px solid #f0883e40; }
    .min-badge.gray   { background: #21262d; color: #8b949e; border: 1px solid #30363d; }

    .status-tag {
      position: absolute; top: 12px; right: 12px;
      font-size: 10px; font-weight: 700; border-radius: 4px;
      padding: 2px 8px; display: flex; align-items: center; gap: 5px;
    }
    .status-tag.green  { background: #3fb95020; color: #3fb950; border: 1px solid #3fb95050; }
    .status-tag.orange { background: #f0883e18; color: #f0883e; border: 1px solid #f0883e40; }
    .status-tag.gray   { background: #21262d; color: #8b949e; border: 1px solid #30363d; }

    .teams-row { display: flex; align-items: center; gap: 8px; }
    .team { flex: 1; font-size: 15px; font-weight: 700; }
    .team.away { text-align: right; }
    .score-block {
      flex-shrink: 0; border-radius: 6px; padding: 5px 14px;
      font-size: 19px; font-weight: 800; letter-spacing: 3px;
      min-width: 76px; text-align: center; background: #0d1117;
    }
    .score-block.green  { border: 1px solid #3fb95060; color: #3fb950; }
    .score-block.orange { border: 1px solid #f0883e60; color: #f0883e; }
    .score-block.gray   { border: 1px solid #30363d; color: #8b949e; }

    .odds-row { display: flex; gap: 6px; margin-top: 10px; }
    .odd-btn { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 5px; padding: 5px 6px; text-align: center; }
    .odd-btn .odd-label { display: block; font-size: 10px; color: #484f58; }
    .odd-btn .odd-val   { display: block; font-size: 14px; font-weight: 700; color: #e6edf3; }

    .meta { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: #484f58; flex-wrap: wrap; }

    .state { text-align: center; padding: 64px 20px; color: #8b949e; }
    .state .icon { font-size: 48px; display: block; margin-bottom: 12px; }
    .state .sub { font-size: 12px; color: #484f58; margin-top: 8px; }
    .spinner { width: 34px; height: 34px; border: 3px solid #21262d; border-top-color: #f0883e; border-radius: 50%; animation: spin .75s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .retry-btn { margin-top: 14px; background: #f0883e; color: #0d1117; border: none; border-radius: 6px; padding: 8px 18px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .foot { text-align: center; font-size: 11px; color: #484f58; padding: 12px 0 24px; }
  </style>
</head>
<body>

<header>
  <a class="back-btn" href="/">&#8592; Live</a>
  <div class="logo">&#127919; Pro Bets</div>
  <div class="spacer"></div>
  <button id="install-btn" title="Install app">&#11015;&#65039; Install</button>
  <button id="notif-btn">&#128277; Alerts</button>
  <span class="refresh-label">Next in</span>
  <div id="countdown">15s</div>
</header>

<div class="stats">
  <div class="stat"><div class="val green"  id="s-probet">--</div><div class="lbl">Pro Bets</div></div>
  <div class="stat"><div class="val orange" id="s-watching">--</div><div class="lbl">Watching</div></div>
  <div class="stat"><div class="val gray"   id="s-tracking">--</div><div class="lbl">Tracking</div></div>
  <div class="stat"><div class="val"        id="s-total">--</div><div class="lbl">Total</div></div>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search team or league..." />
  </div>
</div>

<div class="grid" id="grid">
  <div class="state"><div class="spinner"></div>Loading...</div>
</div>
<div class="foot" id="foot"></div>

<script>
var REFRESH_SEC = 15;
var allMatches = [];
var trackedTotal = 0;
var countdown = REFRESH_SEC;
var timer;

function parseMin(t) {
  if (!t) return 0;
  return parseInt(t.split(':')[0]) || 0;
}

function fmtScore(s) {
  if (!s || s === '-:-' || s === '') return '0 - 0';
  return s.replace(':', ' - ');
}

function stageInfo(m) {
  var min = parseMin(m.match_time);
  var isHT = m.event_status === 'half time';
  if (m.stage === 'probet') {
    return { color: 'green', label: 'Pro Bet ' + min + "'", minLabel: min + "'" };
  }
  if (m.stage === 'watching') {
    var ml = isHT ? 'HT' : min + "'";
    return { color: 'orange', label: isHT ? 'Half Time' : 'Watching ' + min + "'", minLabel: ml };
  }
  return { color: 'gray', label: 'Tracking ' + min + "'", minLabel: min + "'" };
}

function renderCard(m) {
  var info = stageInfo(m);
  var score = fmtScore(m.current_score);
  var htScore = (m.ht_score && m.ht_score !== '-:-' && m.ht_score !== '') ? m.ht_score.replace(':', ' - ') : null;

  var h1 = m.home_odd    ? '<div class="odd-btn"><span class="odd-label">1</span><span class="odd-val">' + m.home_odd + '</span></div>' : '';
  var hx = m.neutral_odd ? '<div class="odd-btn"><span class="odd-label">X</span><span class="odd-val">' + m.neutral_odd + '</span></div>' : '';
  var h2 = m.away_odd    ? '<div class="odd-btn"><span class="odd-label">2</span><span class="odd-val">' + m.away_odd + '</span></div>' : '';

  var metaParts = [];
  if (htScore) metaParts.push('HT ' + htScore);
  if ((m.home_corners || 0) + (m.away_corners || 0) > 0) metaParts.push('Corners ' + (m.home_corners||0) + '-' + (m.away_corners||0));
  if (m.first_goal_min) metaParts.push('First goal ' + m.first_goal_min + "'");
  var metaHtml = metaParts.length ? '<div class="meta"><span>' + metaParts.join(' &middot; ') + '</span></div>' : '';

  var oddsHtml = (h1 || hx || h2) ? '<div class="odds-row">' + h1 + hx + h2 + '</div>' : '';
  var cardClass = m.stage === 'probet' ? 'probet' : m.stage === 'watching' ? 'watching' : 'tracking';

  return '<div class="card ' + cardClass + '">' +
    '<div class="status-tag ' + info.color + '"><span class="sdot ' + info.color + '"></span>' + info.label + '</div>' +
    '<div class="card-top">' +
      '<span class="league-name">' + (m.competition || '') + '</span>' +
      '<span class="min-badge ' + info.color + '">' + info.minLabel + '</span>' +
    '</div>' +
    '<div class="teams-row">' +
      '<div class="team home">' + m.home_team + '</div>' +
      '<div class="score-block ' + info.color + '">' + score + '</div>' +
      '<div class="team away">' + m.away_team + '</div>' +
    '</div>' +
    metaHtml + oddsHtml +
  '</div>';
}

function render() {
  var q = document.getElementById('search').value.toLowerCase();
  var list = q
    ? allMatches.filter(function(m) {
        return (m.home_team||'').toLowerCase().indexOf(q) >= 0 ||
               (m.away_team||'').toLowerCase().indexOf(q) >= 0 ||
               (m.competition||'').toLowerCase().indexOf(q) >= 0;
      })
    : allMatches.slice();

  var probets  = list.filter(function(m) { return m.stage === 'probet'; });
  var watching = list.filter(function(m) { return m.stage === 'watching'; });
  var tracking = list.filter(function(m) { return m.stage === 'tracking'; });

  document.getElementById('s-probet').textContent  = allMatches.filter(function(m){ return m.stage==='probet'; }).length;
  document.getElementById('s-watching').textContent= allMatches.filter(function(m){ return m.stage==='watching'; }).length;
  document.getElementById('s-tracking').textContent= allMatches.filter(function(m){ return m.stage==='tracking'; }).length;
  document.getElementById('s-total').textContent   = trackedTotal;

  var grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="state"><span class="icon">&#127919;</span>Nothing here yet.<div class="sub">Matches kicking off within the first 10 minutes are automatically tracked.</div></div>';
    return;
  }

  var parts = [];
  if (probets.length) {
    parts.push('<div class="section-label"><span class="sdot green"></span>Perfect Pro Bets &mdash; 2nd half, no goal, 55\'+</div>');
    probets.forEach(function(m) { parts.push(renderCard(m)); });
  }
  if (watching.length) {
    parts.push('<div class="section-label"><span class="sdot orange"></span>Watching &mdash; 1st half / half time</div>');
    watching.forEach(function(m) { parts.push(renderCard(m)); });
  }
  if (tracking.length) {
    parts.push('<div class="section-label"><span class="sdot gray"></span>Being Tracked &mdash; kicked off within 10\'</div>');
    tracking.forEach(function(m) { parts.push(renderCard(m)); });
  }
  grid.innerHTML = parts.join('');
}

function fetchProBets(silent) {
  if (!silent) document.getElementById('grid').innerHTML = '<div class="state"><div class="spinner"></div>Loading...</div>';
  fetch('/api/pro-bets')
    .then(function(res) { return res.json(); })
    .then(function(json) {
      if (!json.ok) throw new Error(json.error || 'API error');
      allMatches   = json.matches || [];
      trackedTotal = json.total   || 0;
      document.getElementById('foot').textContent =
        'Updated ' + new Date(json.fetched_at).toLocaleTimeString() +
        '  |  ' + allMatches.length + ' active / ' + trackedTotal + ' tracked';
      render();
    })
    .catch(function(err) {
      if (!silent) document.getElementById('grid').innerHTML =
        '<div class="state"><span class="icon">&#9888;&#65039;</span>Failed to load<div class="sub">' + err.message + '</div>' +
        '<button class="retry-btn" onclick="fetchProBets()">Retry</button></div>';
    });
}

function startCountdown() {
  clearInterval(timer);
  countdown = REFRESH_SEC;
  document.getElementById('countdown').textContent = countdown + 's';
  timer = setInterval(function() {
    countdown--;
    document.getElementById('countdown').textContent = countdown + 's';
    if (countdown <= 0) { fetchProBets(true); countdown = REFRESH_SEC; }
  }, 1000);
}

document.getElementById('search').addEventListener('input', render);
fetchProBets();
startCountdown();
</script>
<script src="/pwa.js"></script>
</body>
</html>
